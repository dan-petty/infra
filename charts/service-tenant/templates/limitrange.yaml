{{- /*
The default requests and limits of each container in each namespace of the service. A container
that sets its own requests and limits keeps them.
*/ -}}
{{- if .Values.name }}
{{- range .Values.namespaces }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resources
  namespace: {{ .name }}
  labels:
    {{- include "service-tenant.labels" $ | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ $.Values.limitRange.default.cpu | quote }}
        memory: {{ $.Values.limitRange.default.memory | quote }}
      defaultRequest:
        cpu: {{ $.Values.limitRange.defaultRequest.cpu | quote }}
        memory: {{ $.Values.limitRange.defaultRequest.memory | quote }}
{{- end }}
{{- end }}
