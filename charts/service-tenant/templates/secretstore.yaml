{{- /*
The secret store of the service (README.md, "Secrets"), when the entry sets secrets.store: true. The
store namespace <name>-secrets holds the Secrets that the service keeps: values that it writes with
a PushSecret and values that a person writes. The SecretStore store in each namespace of the
service reads and writes the store namespace with the Kubernetes provider of ESO, as the
ServiceAccount eso-store of its own namespace. A store can read each Secret of its remote
namespace, so each service has its own store namespace, and no ClusterSecretStore reads it. The
service AppProject has no SecretStore, no RBAC kind and no destination in the store namespace, so
only this chart can point a store at it (devops-cli ADR 0033).
*/ -}}
{{- if include "service-tenant.store" . }}
{{- $store := include "service-tenant.storeNamespace" . }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $store }}
  labels:
    {{- include "service-tenant.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# The Kubernetes provider reads a Secret with get, list and watch, and a PushSecret makes and
# updates it with create and update.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store
  namespace: {{ $store }}
  labels:
    {{- include "service-tenant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
{{- range .Values.namespaces }}
---
# ESO requests a token of this ServiceAccount for the SecretStore. No pod needs it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store
  namespace: {{ .name }}
  labels:
    {{- include "service-tenant.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: store
  namespace: {{ .name }}
  labels:
    {{- include "service-tenant.labels" $ | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $store }}
      server:
        url: https://kubernetes.default.svc
        # The CA of the API server, in the ConfigMap that Kubernetes puts in each namespace.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-{{ .name }}
  namespace: {{ $store }}
  labels:
    {{- include "service-tenant.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-store
subjects:
  - kind: ServiceAccount
    name: eso-store
    namespace: {{ .name }}
{{- end }}
{{- end }}
