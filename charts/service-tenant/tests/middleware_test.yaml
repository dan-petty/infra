suite: Traefik Middleware security-headers of each namespace
templates:
  - templates/middleware.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders the Middleware security-headers in each namespace
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Middleware
      - isAPIVersion:
          of: traefik.io/v1alpha1
      - equal:
          path: metadata.name
          value: security-headers
      - equal:
          path: metadata.namespace
          value: example
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: example-db
        documentIndex: 1
  - it: sets HSTS for one year with no preload, and the other security headers
    asserts:
      - equal:
          path: spec.headers
          value:
            stsSeconds: 31536000
            stsIncludeSubdomains: true
            stsPreload: false
            contentTypeNosniff: true
            customFrameOptionsValue: SAMEORIGIN
            referrerPolicy: strict-origin-when-cross-origin
            permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
