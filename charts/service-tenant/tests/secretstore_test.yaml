suite: Secret store of the service
templates:
  - templates/secretstore.yaml
tests:
  - it: renders no store object when the entry has no key secrets
    values:
      - ../ci/test-values.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no store object when secrets.store is false
    values:
      - ../ci/store-values.yaml
    set:
      secrets:
        store: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders one store namespace, a ServiceAccount, a SecretStore and a RoleBinding for each namespace, and one Role
    values:
      - ../ci/store-values.yaml
    asserts:
      - hasDocuments:
          count: 8
      - containsDocument:
          apiVersion: v1
          kind: Namespace
          name: example-secrets
        documentIndex: 0
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          name: eso-store
          namespace: example-secrets
        documentIndex: 1
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: eso-store
          namespace: example
        documentIndex: 2
      - containsDocument:
          apiVersion: external-secrets.io/v1
          kind: SecretStore
          name: store
          namespace: example
        documentIndex: 3
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          name: eso-store-example
          namespace: example-secrets
        documentIndex: 4
      - containsDocument:
          apiVersion: v1
          kind: ServiceAccount
          name: eso-store
          namespace: example-db
        documentIndex: 5
      - containsDocument:
          apiVersion: external-secrets.io/v1
          kind: SecretStore
          name: store
          namespace: example-db
        documentIndex: 6
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          name: eso-store-example-db
          namespace: example-secrets
        documentIndex: 7
  - it: renders no ClusterSecretStore and no cluster-scoped RBAC kind
    values:
      - ../ci/store-values.yaml
    asserts:
      - containsDocument:
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          name: store
        not: true
        any: true
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          name: eso-store
        not: true
        any: true
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          name: eso-store
        not: true
        any: true
  - it: enforces restricted in the store namespace and keeps it when Argo CD prunes or deletes the Application
    values:
      - ../ci/store-values.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: restricted
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/warn"]
          value: restricted
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/audit"]
          value: restricted
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false
      - notExists:
          path: metadata.labels["monitoring-scrape"]
  - it: gives each SecretStore the Kubernetes provider on the store namespace with the ServiceAccount eso-store
    values:
      - ../ci/store-values.yaml
    asserts:
      - equal:
          path: spec
          value:
            provider:
              kubernetes:
                remoteNamespace: example-secrets
                server:
                  url: https://kubernetes.default.svc
                  caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                auth:
                  serviceAccount:
                    name: eso-store
        documentIndex: 3
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: example-secrets
        documentIndex: 6
      - equal:
          path: spec.provider.kubernetes.auth.serviceAccount.name
          value: eso-store
        documentIndex: 6
  - it: gives the Role only get, list, watch, create and update on Secrets
    values:
      - ../ci/store-values.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get, list, watch, create, update]
  - it: binds the Role to the ServiceAccount eso-store of each namespace
    values:
      - ../ci/store-values.yaml
    asserts:
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: eso-store
        documentIndex: 4
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: eso-store
              namespace: example
        documentIndex: 4
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: eso-store
              namespace: example-db
        documentIndex: 7
  - it: mounts no token in the ServiceAccount eso-store
    values:
      - ../ci/store-values.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: names the store namespace after the service
    values:
      - ../ci/store-values.yaml
    set:
      name: shop
      namespaces:
        - name: shop
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: shop-secrets
        documentIndex: 0
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: shop-secrets
        documentIndex: 3
