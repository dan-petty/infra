suite: LimitRange of each namespace
templates:
  - templates/limitrange.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders a LimitRange in each namespace
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: LimitRange
      - equal:
          path: metadata.name
          value: default-resources
      - equal:
          path: metadata.namespace
          value: example
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: example-db
        documentIndex: 1
  - it: sets the default requests and limits of each container
    asserts:
      - equal:
          path: spec.limits
          value:
            - type: Container
              default:
                cpu: 500m
                memory: 256Mi
              defaultRequest:
                cpu: 50m
                memory: 64Mi
  - it: uses the limits of the consumer
    set:
      limitRange:
        default:
          cpu: "1"
          memory: 1Gi
        defaultRequest:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.limits[0].default.memory
          value: 1Gi
      - equal:
          path: spec.limits[0].defaultRequest.cpu
          value: 100m
