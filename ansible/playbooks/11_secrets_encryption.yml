---
# 11_secrets_encryption.yml — Encrypt Kubernetes Secrets at rest on the K3s server (aescbc)
# The play has no default host: ansible-playbook dan_petty.infra.11_secrets_encryption -e target_hosts=<group>.
- name: Encrypt Kubernetes Secrets at rest
  hosts: "{{ target_hosts }}"
  become: true
  vars:
    k3s_bin: /usr/local/bin/k3s
    k3s_state_db: /var/lib/rancher/k3s/server/db/state.db
    # Prints "<current secret rows> <rows not encrypted with aescbc>" from the kine datastore.
    count_plaintext_secrets: |
      import sqlite3, sys
      db = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
      rows = db.execute(
          "SELECT k.value FROM kine k JOIN (SELECT name, MAX(id) AS id FROM kine"
          " WHERE name LIKE '/registry/secrets/%' GROUP BY name) m ON k.id = m.id"
          " WHERE k.deleted = 0"
      ).fetchall()
      plain = sum(1 for (value,) in rows if not bytes(value or b"").startswith(b"k8s:enc:aescbc:"))
      print(len(rows), plain)
  tasks:
    # Renders server configuration with secrets-encryption enabled and restarts K3s when changed.
    - name: Restart the server with secrets-encryption in its configuration
      ansible.builtin.include_role:
        name: "{{ k3s_server_role_name | default('k3s_server') }}"

    - name: Read secrets encryption status
      ansible.builtin.command: "{{ k3s_bin }} secrets-encrypt status"
      register: encryption_status
      changed_when: false
      check_mode: false

    - name: Require encryption enabled with matching key hashes
      ansible.builtin.assert:
        that:
          - "'Encryption Status: Enabled' in encryption_status.stdout"
          - "'All hashes match' in encryption_status.stdout"
        fail_msg: "{{ encryption_status.stdout }}"
      when: not ansible_check_mode

    - name: Count Secrets still stored as plaintext
      ansible.builtin.command:
        argv: [python3, -c, "{{ count_plaintext_secrets }}", "{{ k3s_state_db }}"]
      register: plaintext_before
      changed_when: false
      check_mode: false

    # A Secret that changes between the get and the replace fails with a conflict and is retried.
    - name: Rewrite every Secret so it is stored encrypted
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ k3s_bin }} kubectl get secrets --all-namespaces -o json
        | {{ k3s_bin }} kubectl replace -f - > /dev/null
      args:
        executable: /bin/bash
      register: secrets_rewritten
      changed_when: true
      until: secrets_rewritten.rc == 0
      retries: 3
      delay: 5
      when: (plaintext_before.stdout.split() | last | int) > 0

    - name: Count Secrets still stored as plaintext after the rewrite
      ansible.builtin.command:
        argv: [python3, -c, "{{ count_plaintext_secrets }}", "{{ k3s_state_db }}"]
      register: plaintext_after
      changed_when: false
      when: not ansible_check_mode

    - name: Require every Secret encrypted at rest
      ansible.builtin.assert:
        that:
          - "(plaintext_after.stdout.split() | last | int) == 0"
        fail_msg: "Secrets / still plaintext: {{ plaintext_after.stdout }}"
        success_msg: "Secrets / still plaintext: {{ plaintext_after.stdout }}"
      when: not ansible_check_mode
