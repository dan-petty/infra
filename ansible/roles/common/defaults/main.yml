---
# Default variables for the common role (meta/argument_specs.yml).
# Note: common_apt_suite has no default and is required.

common_ufw_allowed_cidrs: []
common_k3s_pod_cidr: "10.42.0.0/16"
common_k3s_service_cidr: "10.43.0.0/16"

common_base_packages:
  - curl
  - wget
  - git
  - zstd
  - htop
  - iotop
  - btop
  - net-tools
  - iptables
  - iproute2
  - socat
  - conntrack
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - pciutils
  - lshw
  - lm-sensors
  - open-iscsi
  - ufw
  - python3-yaml
  - python3-debian
  - systemd-timesyncd

common_kernel_modules:
  - overlay
  - br_netfilter
  - ip_tables
  - iptable_nat
  - iptable_filter

common_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.forwarding: 1
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 8192
  vm.max_map_count: 262144

common_automation_user: "ansible"
common_automation_user_shell: "/bin/bash"
common_automation_user_groups:
  - sudo
common_automation_user_pubkeys: []

common_system_upgrade_on_bootstrap: true
common_system_upgrade_type: "dist"
common_system_upgrade_autoremove: true
common_system_upgrade_clean: true

# The systemd default target (tasks/default_target.yml). common_default_target has no default: a
# host that does not set it keeps its default target.
common_display_manager_stop: false
common_default_target_link: "/etc/systemd/system/default.target"
