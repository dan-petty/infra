---
# The settings of the role nvidia that a play, group_vars or host_vars can replace
# (meta/argument_specs.yml). The defaults are for Debian 13 on amd64 with the current driver branch.

# The CUDA repository of the current driver branch, and its signing key.
nvidia_cuda_repo_url: https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/
nvidia_cuda_repo_gpg: https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/8793F200.pub

# The CUDA repository of a pinned driver branch. The role adds it only on a host that sets
# nvidia_driver_branch (README.md, "Pin a driver branch").
nvidia_legacy_cuda_repo_url: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/

# The driver packages. A GPU older than Turing needs nvidia-kernel-dkms in place of
# nvidia-kernel-open-dkms.
nvidia_driver_packages:
  - nvidia-driver
  - nvidia-driver-cuda
  - nvidia-kernel-open-dkms

# The NVIDIA Container Toolkit repository, its signing key and its packages.
nvidia_container_toolkit_repo_url: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
nvidia_container_toolkit_repo_gpg: https://nvidia.github.io/libnvidia-container/gpgkey
nvidia_container_toolkit_packages:
  - nvidia-container-toolkit
  - nvidia-container-toolkit-base
  - libnvidia-container-tools
  - libnvidia-container1

# The nvidia-ctk binary that writes the CDI specification.
nvidia_ctk_path: /usr/bin/nvidia-ctk
