# The test overlay of the component valkey-acl: the base with the users of an aclfile. The Secret
# valkey-acl is not in the overlay: the consumer creates it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example
resources:
  - ../../bases/valkey
components:
  - ../../components/valkey-acl
