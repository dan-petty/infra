# The test overlay of the component default-perimeter with the monitoring port patched to 9100.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example
components:
  - ../../components/default-perimeter
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: default-perimeter
    patch: |-
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 9100
