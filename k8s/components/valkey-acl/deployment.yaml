# The key users.acl of the Secret valkey-acl is the file /etc/valkey/users.acl. It is read-only,
# so ACL SAVE fails: a change of the users is a change of the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  template:
    spec:
      containers:
        - name: valkey
          volumeMounts:
            - name: acl
              mountPath: /etc/valkey/users.acl
              subPath: users.acl
              readOnly: true
      volumes:
        - name: acl
          secret:
            secretName: valkey-acl
            # 0440: the owner and the group of the file (fsGroup) read it.
            defaultMode: 288
            items:
              - key: users.acl
                path: users.acl
