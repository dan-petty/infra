# The component valkey-exporter of the base valkey: a redis_exporter sidecar that gives the metrics
# of Valkey on port 9121, and the NetworkPolicy that admits the scraper to that port
# (k8s/bases/valkey/README.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy.yaml
patches:
  - path: deployment.yaml
# The image of the exporter, with a tag and a digest in newTag, as in the base valkey.
images:
  - name: ghcr.io/oliver006/redis_exporter
    newTag: v1.99.0@sha256:2c0cdc2452096b5af460d870e72fa6ee2ebb971780f443a616885685d2c0ebad
