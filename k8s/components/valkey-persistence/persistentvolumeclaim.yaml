# Argo CD never prunes or deletes this claim and the data on its volume (the kube-linter check
# pvc-prune-protection of .kube-linter.yaml). The claim has no storage class, so the default
# storage class of the cluster gives the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  labels:
    app.kubernetes.io/name: valkey
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
