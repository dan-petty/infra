# Default perimeter: deny all ingress and egress, allow egress to DNS in kube-system, and allow
# ingress from namespace monitoring on TCP port 9090 for metrics scrapes. Each policy has one type:
# the network policy controller of k3s skips the ingress rules of a policy of both types for
# traffic that an egress rule allows (dan-petty/devops-cli#6707).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-perimeter-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-perimeter-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
