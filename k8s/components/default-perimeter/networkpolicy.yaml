# Default perimeter: deny all ingress and egress, allow egress to DNS in kube-system, and allow
# ingress from namespace monitoring on TCP port 9090 for metrics scrapes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-perimeter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
