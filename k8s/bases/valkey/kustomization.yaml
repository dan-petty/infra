# The base valkey: one Valkey store for a cache or a queue. The consumer sets the namespace, creates
# the Secret valkey-auth and can replace valkey.conf with a configMapGenerator of behavior merge.
# The components valkey-persistence, valkey-exporter and valkey-acl add a claim, the metrics
# exporter and ACL users (README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# The image of Valkey, with a tag and a digest. newTag holds both, because the kustomize manager of
# Renovate updates both only in that form: it skips an image with the fields newTag and digest. A
# consumer can replace the image, such as with a mirror, with images: of its own overlay.
images:
  - name: docker.io/valkey/valkey
    newTag: 9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
# The name of the ConfigMap gets the hash of its content, so a change of valkey.conf starts a new
# pod with the new settings.
configMapGenerator:
  - name: valkey
    files:
      - valkey.conf
    options:
      labels:
        app.kubernetes.io/name: valkey
