# The settings of the base: a cache. Valkey keeps no file, and at maxmemory it evicts the least
# recently used entry. The container starts valkey-server with this file and adds the requirepass
# line from the Secret valkey-auth (deployment.yaml). A consumer replaces this file with a
# configMapGenerator of behavior merge (README.md). The file has no bind line, so protected mode
# refuses each client from another address when the user default has no requirepass.
port 6379
dir /data
save ""
appendonly no
# Half of the 256Mi memory limit of the container: a fork that writes a snapshot or rewrites the
# append-only file needs memory for the pages that change.
maxmemory 128mb
maxmemory-policy allkeys-lru
