# The AppProject of the tenant Applications of the ApplicationSet service-tenants. A tenant
# Application renders the chart charts/service-tenant of infra with the value files of the
# environment repository. The allow-lists hold only the kinds that the chart renders: the
# ServiceAccount, the RBAC kinds and the SecretStore are those of the secret store of a service
# (charts/service-tenant/README.md, "Secrets"). The destinations admit argocd, which holds the
# AppProject of each service, and each namespace but the reserved ones. A deny destination refuses
# a namespace although another destination admits it. The consumer adds the URL of its environment
# repository and a deny destination for each platform namespace of its cluster
# (docs/service-repos.md, "Consumer patches").
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services-admin
  namespace: argocd
spec:
  description: The tenants of the service repositories (dan-petty/infra docs/service-repos.md).
  sourceRepos:
    - https://github.com/dan-petty/infra.git
    - https://git.example.com/environment.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: object-store
    - server: https://kubernetes.default.svc
      namespace: '*'
    - server: https://kubernetes.default.svc
      namespace: '!kube-system'
    - server: https://kubernetes.default.svc
      namespace: '!kube-public'
    - server: https://kubernetes.default.svc
      namespace: '!kube-node-lease'
    - server: https://kubernetes.default.svc
      namespace: '!default'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ''
      kind: LimitRange
    - group: traefik.io
      kind: Middleware
    - group: ''
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: external-secrets.io
      kind: SecretStore
    - group: seaweed.seaweedfs.com
      kind: Bucket
    - group: seaweed.seaweedfs.com
      kind: S3Identity
    - group: seaweed.seaweedfs.com
      kind: S3Policy
    - group: seaweed.seaweedfs.com
      kind: S3PolicyBinding
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: PushSecret
    - group: generators.external-secrets.io
      kind: Password
