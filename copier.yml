# The Copier template of a new repository of dan-petty (templates/README.md). `devops repos onboard`
# renders it at a release tag of infra, with the answers of its flags:
#   copier copy --vcs-ref vX.Y.Z --data scopes=api https://github.com/dan-petty/infra.git <dir>
# Copier renders only the files of templates/repository/. A file with the suffix .jinja holds an
# answer: Copier renders it and removes the suffix. Copier copies each other file as it is. The
# template has no _tasks and no _jinja_extensions, so Copier runs it without --trust. Copier writes
# the answers into .copier-answers.yml, and the copier manager of Renovate updates the repository to
# the newest release tag of infra with `copier update`. infra itself is the template source, not a
# render of it, so it has no .copier-answers.yml.

# Copier 9.2.0 matches each pattern of _exclude with the rendered path, with no suffix .jinja.
_min_copier_version: "9.2.0"
_subdirectory: templates/repository

# Each file has one owner (#225). The template owns each file of templates/repository/:
# `copier update` and `copier recopy` write it again from the answers, so a change of such a file
# goes into the template or into an answer, not into the repository. The files of _skip_if_exists
# belong to the repository after the first copy: its own Renovate rules, pre-commit hooks and
# project profile, and the version files that release-please writes. Copier writes such a file only
# when the repository does not hold it, also on `copier update` and `copier recopy --overwrite`.
_skip_if_exists:
  - .github/renovate.json
  - .pre-commit-config.yaml
  - .devops/project.toml
  - version.txt
  - .release-please-manifest.json

# The files of the release flow. A repository with no release flow gets none of them, and
# version.txt is the version file of the release type simple only.
_exclude:
  - "{% if not release_flow %}.github/workflows/release.yml{% endif %}"
  - "{% if not release_flow %}release-please-config.json{% endif %}"
  - "{% if not release_flow %}.release-please-manifest.json{% endif %}"
  - "{% if not (release_flow and release_type == 'simple') %}version.txt{% endif %}"

release_flow:
  type: bool
  help: >-
    Make releases with release-please: a release pull request, the tag vX.Y.Z and the GitHub
    release. The release job runs in the environment release, which a private repository on the
    GitHub Free plan does not have (devops-cli#6773, decision D2). So the default is false, and the
    caller answers true for a repository with environments.
  default: false

release_type:
  type: str
  help: The release-please release type, which names the version file of the repository.
  choices:
    - simple
    - python
    - node
  default: simple
  when: "{{ release_flow }}"

scopes:
  type: str
  help: >-
    The Conventional Commit scopes of the repository, separated by commas, such as api,worker. Each
    scope gets a label scope/<scope>. The template always adds the scopes ci, deps and docs.
  default: ""
  validator: >-
    {% for scope in scopes.split(',') | map('trim') | reject('equalto', '') -%}
    {% if not (scope | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) -%}
    The scope "{{ scope }}" is not a lowercase name, such as api or event-stream.
    {% elif scope == 'main' -%}
    The scope main is the scope of the release pull request of release-please.
    {% endif %}{% endfor %}

code_owner:
  type: str
  help: The code owner of each file, whom GitHub asks to review each pull request.
  default: "@dan-petty"
  validator: >-
    {% if not (code_owner | regex_search('^@[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?$')) -%}
    The code owner is a GitHub user or team, such as @dan-petty.
    {% endif %}

scope_descriptions:
  type: yaml
  help: >-
    The description of a scope/* label, by scope, such as {api: "The HTTP API in api/"}. A scope of
    the repository with no description gets "The area <scope> of this repository", and ci, deps and
    docs get the description of the template. GitHub allows 100 characters.
  default: {}
  validator: >-
    {% set known = ['ci', 'deps', 'docs'] + (scopes.split(',') | map('trim') | list) -%}
    {% if scope_descriptions is not mapping -%}
    The scope descriptions are a mapping of a scope to its description, such as {api: "The API"}.
    {% else %}{% for scope, text in scope_descriptions.items() -%}
    {% if scope not in known -%}
    The scope "{{ scope }}" has a description, but it is not ci, deps, docs or a scope of scopes.
    {% elif text is not string or not text or text | length > 100 or '"' in text or '\\' in text -%}
    The description of the scope "{{ scope }}" is not a text of 1 to 100 characters with no " or \.
    {% endif %}{% endfor %}{% endif %}

required_checks:
  type: str
  help: >-
    The checks of the workflows of the repository that each pull request into main must pass, with
    the title check of the template, separated by commas, such as K8s,Lint. The ruleset main of
    github/repository.yaml requires each of them from GitHub Actions.
  default: ""
  validator: >-
    {% for check in required_checks.split(',') | map('trim') | reject('equalto', '') -%}
    {% if not (check | regex_search('^[A-Za-z0-9][A-Za-z0-9 ._/()-]*$')) -%}
    The check "{{ check }}" is not the name of a job, such as K8s or Lint / yamllint.
    {% endif %}{% endfor %}

code_coverage:
  type: bool
  help: >-
    Gate pull requests with a code_coverage rule in the ruleset main of github/repository.yaml. The
    default is false. Answer true for a repository that reports coverage.
  default: false

# The release tag of infra in the comment of each caller of a reusable workflow. Copier gives
# _commit, the tag that it renders. The caller pins _copier_conf.vcs_ref_hash, the commit of that
# tag, so it always calls the workflows of that tag. Copier does not ask it and does not write it
# into .copier-answers.yml, so `copier update` gives the callers the new tag and its commit.
infra_ref:
  type: str
  when: false
  default: "{{ _commit }}"
