# Prometheus Server Helm values template (#78).
# Chart: prometheus-community/prometheus (29.47.2)
# Repo:  https://prometheus-community.github.io/helm-charts
#
# Prometheus monitors Kubernetes cluster resources and applications.

server:
  deploymentAnnotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: >-
      Prometheus server with persistent storage requires Recreate strategy
    ignore-check.kube-linter.io/no-liveness-probe: >-
      Rule-loader sidecar watches ConfigMaps and does not serve traffic
    ignore-check.kube-linter.io/no-readiness-probe: >-
      Rule-loader sidecar watches ConfigMaps and does not serve traffic

  persistentVolume:
    annotations:
      argocd.argoproj.io/sync-options: "Prune=false,Delete=false"

  tsdb:
    out_of_order_time_window: 10m

  otlp:
    translation_strategy: UnderscoreEscapingWithoutSuffixes

  extraArgs:
    web.enable-remote-write-receiver: ""
    web.enable-otlp-receiver: ""
    enable-feature: created-timestamp-zero-ingestion

  extraVolumes:
    - name: dynamic-rules
      emptyDir: {}
    - name: placeholder-rules
      configMap:
        name: prometheus-server
        items:
          - key: rules-placeholder.yml
            path: rules-placeholder.yml

  extraVolumeMounts:
    - name: dynamic-rules
      mountPath: /etc/prometheus/rules/services/dynamic
      readOnly: true
    - name: placeholder-rules
      mountPath: /etc/prometheus/rules/services/base
      readOnly: true

  sidecarContainers:
    rule-loader:
      image: kiwigrid/k8s-sidecar:2.14.3
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: LABEL
          value: prometheus-rule
        - name: LABEL_VALUE
          value: "true"
        - name: FOLDER
          value: /etc/prometheus/rules/services/dynamic
        - name: RESOURCE
          value: configmap
        - name: NAMESPACE
          value: ALL
        - name: UNIQUE_FILENAMES
          value: "true"
        - name: RELOAD_URL
          value: http://localhost:9090/-/reload
        - name: RELOAD_METHOD
          value: POST
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: dynamic-rules
          mountPath: /etc/prometheus/rules/services/dynamic

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi

  service:
    servicePort: 9090

  containerSecurityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    containerSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      runAsGroup: 65534
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

alertmanager:
  enabled: true
  automountServiceAccountToken: false
  statefulSet:
    annotations:
      ignore-check.kube-linter.io/no-rolling-update-strategy: >-
        Alertmanager StatefulSet defaults to RollingUpdate in Kubernetes
  configmapReload:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
    k8s.grafana.com/metrics.container: alertmanager
  config:
    route:
      receiver: "null"
      group_by: [alertname, node]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
    inhibit_rules:
      - source_matchers:
          - alertname="NodeNotReady"
        target_matchers:
          - alertname="TargetDown"
        equal: [node]
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: [alertname, node, gpu, mountpoint]

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-pushgateway:
  enabled: false

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false

serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
      - /etc/prometheus/rules/services/base/*.yml
      - /etc/prometheus/rules/services/dynamic/*.yml
  rules-placeholder.yml:
    groups: []
  alerting_rules.yml:
    groups:
      - name: cluster-nodes
        rules:
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not Ready"
              description: >-
                Kubernetes has reported node {{ $labels.node }} not Ready for 5 minutes.
                Its scrape targets' TargetDown alerts are inhibited while this fires.
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels:
              severity: warning
              node: "{{ or $labels.node $labels.instance }}"
            annotations:
              summary: "Scrape target {{ $labels.job }} {{ $labels.instance }} is down"
              description: "Prometheus has not scraped {{ $labels.instance }} (job {{ $labels.job }}) for 10 minutes."
      - name: cluster-storage
        rules:
          - alert: HostFilesystemSpaceLow
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
            for: 15m
            labels:
              severity: warning
              node: "{{ $labels.instance }}"
            annotations:
              summary: >-
                {{ $labels.mountpoint }} on node {{ $labels.instance }} is
                {{ $value | humanizePercentage }} free
              description: >-
                {{ $labels.mountpoint }} on node {{ $labels.instance }} has had under 10% free for 15 minutes.
          - alert: HostFilesystemSpaceLow
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05
            for: 5m
            labels:
              severity: critical
              node: "{{ $labels.instance }}"
            annotations:
              summary: >-
                {{ $labels.mountpoint }} on node {{ $labels.instance }} is
                {{ $value | humanizePercentage }} free
              description: >-
                {{ $labels.mountpoint }} on node {{ $labels.instance }} has had under 5% free for 5 minutes.
