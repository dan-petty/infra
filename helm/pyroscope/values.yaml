# General settings for Grafana Pyroscope.
# Cluster-specific settings belong in service values.

pyroscope:
  replicaCount: 1
  extraArgs:
    log.level: info

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  service:
    type: ClusterIP
    port: 4040
    port_name: http2
    scheme: HTTP

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  podDisruptionBudget:
    enabled: false

architecture:
  microservices:
    enabled: false
  storage:
    v1: false
    v2: true

minio:
  enabled: false

alloy:
  enabled: false

serviceMonitor:
  enabled: true
  relabelings:
    - sourceLabels: [__meta_kubernetes_service_name]
      regex: pyroscope-headless
      action: drop
