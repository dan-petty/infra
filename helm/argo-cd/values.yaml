# Argo CD Helm values template.
# Chart: argo/argo-cd
# Repo:  https://argoproj.github.io/argo-helm

global:
  logging:
    level: warn
  deploymentStrategy:
    type: RollingUpdate

crds:
  keep: true
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false

controller:
  replicas: 1
  livenessProbe:
    enabled: true
  statefulsetAnnotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: >-
      Kubernetes defaults StatefulSet updateStrategy to RollingUpdate
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

server:
  replicas: 1
  deploymentStrategy:
    type: RollingUpdate
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

repoServer:
  replicas: 1
  deploymentStrategy:
    type: RollingUpdate
  automountServiceAccountToken: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 4096Mi
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 3

redis:
  enabled: true
  deploymentStrategy:
    type: RollingUpdate
  deploymentAnnotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: >-
      Kubernetes defaults Deployment strategy to RollingUpdate
  automountServiceAccountToken: false
  image:
    repository: valkey/valkey
    tag: 9.1.4-alpine
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  exporter:
    enabled: true
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 500m
        memory: 64Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1024Mi

redisSecretInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  jobAnnotations:
    ignore-check.kube-linter.io/no-liveness-probe: "batch Job runs to completion"
    ignore-check.kube-linter.io/no-readiness-probe: "batch Job runs to completion"

dex:
  enabled: false

notifications:
  enabled: true
  argocdUrl: ""
  secret:
    create: false
  deploymentStrategy:
    type: RollingUpdate
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  triggers:
    trigger.on-deployed: |
      - description: Application has been deployed successfully.
        send:
          - app-deployed
        when: >-
          app.status.operationState != nil and
          app.status.operationState.phase in ['Succeeded'] and
          app.status.health.status == 'Healthy'
        oncePer: app.status.operationState?.syncResult?.revision
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send:
          - app-sync-failed
        when: >-
          app.status.operationState != nil and
          app.status.operationState.phase in ['Error', 'Failed']
  templates:
    template.app-deployed: |
      message: 'Deployed revision {{ dig "status" "operationState" "syncResult" "revision" "" .app | trunc 7 }}'
    template.app-sync-failed: |
      message: >-
        Application {{ .app.metadata.name }} sync failed:
        {{ dig "status" "operationState" "message" "" .app }}

applicationSet:
  replicas: 1
  deploymentStrategy:
    type: RollingUpdate
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  cm:
    exec.enabled: "true"
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          return hs
  params:
    applicationsetcontroller.enable.scm.providers: "false"
