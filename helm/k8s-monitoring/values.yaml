# Grafana Kubernetes Monitoring Helm values template (#78).
# Chart: grafana/k8s-monitoring (4.6.1)
# Repo:  https://grafana.github.io/helm-charts
#
# Kubernetes Monitoring captures telemetry data from cluster resources and applications.

global:
  scrapeInterval: 60s

selfReporting:
  enabled: false

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  cadvisor:
    metricsTuning:
      includeMetrics:
        - machine_cpu_cores
        - container_cpu_cfs_throttled_seconds_total
        - container_oom_events_total
        - container_network_receive_errors_total
        - container_network_transmit_errors_total
        - container_cpu_usage_seconds_total
        - container_memory_working_set_bytes
        - container_network_receive_packets_total
        - container_network_transmit_packets_total
        - container_network_receive_packets_dropped_total
        - container_network_transmit_packets_dropped_total
        - container_threads
        - container_threads_max
  kube-state-metrics:
    discoveryType: service
    metricsTuning:
      includeMetrics:
        - kube_deployment_labels
        - kube_daemonset_labels
        - kube_statefulset_labels
        - kube_horizontalpodautoscaler_labels
        - kube_service_info
        - kube_ingress_info
        - kube_ingress_path
        - kube_namespace_created
        - kube_namespace_labels
        - kube_networkpolicy_labels
        - kube_endpoint_info
        - kube_secret_info
        - kube_pod_container_status_running
        - kube_pod_status_qos_class
        - kube_pod_status_reason
        - kube_pod_container_status_ready
        - kube_pod_container_status_last_terminated_exitcode
        - kube_pod_container_status_terminated
        - kube_pod_container_status_waiting
        - kube_deployment_status_replicas_unavailable
  kubeDNS:
    enabled: true
    extraDiscoveryRules: &node_rule |
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      useDefaultAllowList: false
      useIntegrationAllowList: false

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

nodeLogs:
  enabled: true
  collector: alloy-logs
  journalLabels:
    transport: transport
  structuredMetadata:
    boot_id: boot_id
  extraDiscoveryRules: |
    rule {
      source_labels = ["__journal__transport"]
      regex         = "kernel"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority", "__journal__systemd_unit", "__journal_unit"]
      separator     = ";"
      regex         = "[0-6];(.*;)?(k3s|k3s-agent|containerd|systemd-journald)\\.service(;.*)?"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__journal_priority"]
      regex         = "[0-4]"
      target_label  = "__tmp_keep"
      replacement   = "true"
    }
    rule {
      source_labels = ["__tmp_keep"]
      regex         = "true"
      action        = "keep"
    }
  extraLogProcessingStages: |
    stage.limit {
      rate          = 1
      burst         = 10000
      by_label_name = "unit"
      drop          = true
    }

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics

prometheusMetricsReceiver:
  enabled: false
  collector: alloy-metrics

profiling:
  enabled: true
  collector: alloy-profiles
  ebpf:
    enabled: true
    targetingScheme: all
  pprof:
    enabled: true

annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  annotations:
    scrape: prometheus.io/scrape
    metricsPortNumber: prometheus.io/port
    metricsPath: prometheus.io/path
  excludeNamespaces:
    - otel
  services:
    enabled: false
  bearerToken:
    enabled: false
  extraDiscoveryRules: *node_rule

integrations:
  collector: alloy-metrics
  alloy:
    instances:
      - name: k8s-monitoring
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-logs
            - alloy-singleton
            - alloy-profiles

telemetryServices:
  kube-state-metrics:
    deploy: true
    updateStrategy: RollingUpdate
    collectorsExtra:
      - endpoints
    metricLabelsAllowlist:
      - namespaces=[*]
      - daemonsets=[*]
      - deployments=[*]
      - statefulsets=[*]
      - horizontalpodautoscalers=[*]
      - networkpolicies=[*]
      - persistentvolumeclaims=[*]
      - pods=[*]
      - services=[*]
      - ingresses=[*]
      - "nodes=[agentpool,alpha.eksctl.io/cluster-name,alpha.eksctl.io/nodegroup-name,\
        beta.kubernetes.io/instance-type,cloud.google.com/gke-nodepool,cluster-name,\
        ec2.amazonaws.com/Name,ec2.amazonaws.com/aws-autoscaling-groupName,\
        ec2.amazonaws.com/aws-autoscaling-group-name,ec2.amazonaws.com/name,\
        eks.amazonaws.com/nodegroup,k8s.io/cloud-provider-aws,karpenter.sh/nodepool,\
        kubernetes.azure.com/cluster,kubernetes.io/arch,kubernetes.io/hostname,\
        kubernetes.io/os,node.kubernetes.io/instance-type,topology.kubernetes.io/region,\
        topology.kubernetes.io/zone]"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  node-exporter:
    deploy: true
    daemonsetAnnotations:
      ignore-check.kube-linter.io/host-network: >-
        node-exporter requires host networking to collect node network metrics
      ignore-check.kube-linter.io/host-pid: >-
        node-exporter requires host PID namespace to collect host process metrics
      ignore-check.kube-linter.io/sensitive-host-mounts: >-
        node-exporter mounts host filesystems to collect host metrics
    extraArgs:
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|\
        configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|\
        overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|\
        sysfs|tracefs|tmpfs|ramfs)$"
      - --collector.systemd
      - --collector.systemd.unit-include=(k3s|k3s-agent|containerd|systemd-journald)\.service
      - --collector.processes
      - --collector.tcpstat
    env:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/host/root/run/dbus/system_bus_socket
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1536Mi
  alloy-singleton:
    presets:
      - singleton
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  alloy-logs:
    presets:
      - daemonset
      - filesystem-log-reader
      - host-storage
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 768Mi
  alloy-profiles:
    presets:
      - daemonset
      - root
    controller:
      hostPID: true
    alloy:
      enableReporting: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1024Mi
