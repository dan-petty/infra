# The written judgments of the trivy config scan of the K8s renders of infra (README.md, "Checks"):
# the K8s job of ci.yml gives this file to the trivy step of k8s-validate.yml. Only a finding of an
# upstream chart of helm/ can get a judgment here. infra fixes each finding of its own templates.
#
# The render step writes each object to its own file <n>-helm-<release>/<kind>-<name>.yaml
# (scripts/k8s-validate.sh), so each entry names one finding ID on one object of one release. Each
# entry has a reason and an expiry date. After the date, the scan reports the finding again, and a
# person checks the judgment again.
misconfigurations:
  # The controller of External Secrets Operator writes the Secret of each ExternalSecret in each
  # namespace, so its ClusterRole manages Secrets in each namespace. No value of the chart removes
  # the rule: scopedRBAC limits ESO to one namespace, which stops one store namespace for each
  # service. The finding is CRITICAL, so the owner decided the judgment and its date.
  - id: KSV-0041
    paths:
      - "*-helm-external-secrets/ClusterRole-external-secrets-controller.yaml"
    statement: >-
      The ESO controller writes the Secret of each ExternalSecret in each namespace; the owner
      accepted this CRITICAL judgment on 2026-11-22 for 30 days (dan-petty/infra#12)
    expired_at: 2026-12-22
  # The cert-controller of ESO writes the TLS certificate of the admission webhook into a Secret,
  # and its ClusterRole has two rules on Secrets.
  - id: KSV-0041
    paths:
      - "*-helm-external-secrets/ClusterRole-external-secrets-cert-controller.yaml"
    statement: >-
      The ESO cert-controller writes the certificate Secret of the admission webhook; the owner
      accepted this CRITICAL judgment on 2026-11-22 for 30 days (dan-petty/infra#12)
    expired_at: 2026-12-22
  # The cert-controller writes the CA bundle of the webhook certificate into the
  # ValidatingWebhookConfigurations of ESO, so its ClusterRole updates and patches them.
  - id: KSV-0114
    paths:
      - "*-helm-external-secrets/ClusterRole-external-secrets-cert-controller.yaml"
    statement: >-
      The ESO cert-controller writes the CA bundle into the ValidatingWebhookConfigurations of ESO;
      the owner accepted this CRITICAL judgment on 2026-11-22 for 30 days (dan-petty/infra#12)
    expired_at: 2026-12-22
  # The CloudNativePG operator manages Secrets for database users, passwords, and TLS certificates.
  - id: KSV-0041
    paths:
      - "*-helm-cloudnative-pg/ClusterRole-cloudnative-pg.yaml"
    statement: >-
      The CloudNativePG operator manages Secrets for Postgres credentials and certificates; the owner
      accepted this CRITICAL judgment on 2026-11-23 for 30 days (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The CloudNativePG operator executes commands in PostgreSQL pods to manage failover and replication.
  - id: KSV-0053
    paths:
      - "*-helm-cloudnative-pg/ClusterRole-cloudnative-pg.yaml"
    statement: >-
      The CloudNativePG operator executes commands in PostgreSQL pods for lifecycle management (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The CloudNativePG operator manages Services and NetworkPolicies for Postgres clusters.
  - id: KSV-0056
    paths:
      - "*-helm-cloudnative-pg/ClusterRole-cloudnative-pg.yaml"
    statement: >-
      The CloudNativePG operator manages Services and NetworkPolicies for clusters (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The CloudNativePG operator updates webhook configurations for its admission webhook.
  - id: KSV-0114
    paths:
      - "*-helm-cloudnative-pg/ClusterRole-cloudnative-pg.yaml"
    statement: >-
      The CloudNativePG operator updates webhook configurations for its admission webhook; the owner
      accepted this CRITICAL judgment on 2026-11-23 for 30 days (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The Barman Cloud plugin accesses backup store credentials stored in Secrets.
  - id: KSV-0041
    paths:
      - "*-helm-plugin-barman-cloud/ClusterRole-plugin-barman-cloud.yaml"
    statement: >-
      The Barman Cloud plugin accesses object store credentials stored in Secrets; the owner
      accepted this CRITICAL judgment on 2026-11-23 for 30 days (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The Argo Workflows workflow controller reads CA certificate Secrets.
  - id: KSV-0041
    paths:
      - "*-helm-argo-workflows/ClusterRole-argo-workflows-workflow-controller.yaml"
    statement: >-
      The Argo Workflows workflow controller reads CA certificate Secrets; the owner
      accepted this CRITICAL judgment on 2026-11-23 for 30 days (dan-petty/infra#18)
    expired_at: 2026-12-23
  # The Argo Workflows workflow controller executes commands in step pods to monitor processes.
  - id: KSV-0053
    paths:
      - "*-helm-argo-workflows/ClusterRole-argo-workflows-workflow-controller.yaml"
    statement: >-
      The Argo Workflows workflow controller executes commands in step pods to monitor processes (dan-petty/infra#18)
    expired_at: 2026-12-23
