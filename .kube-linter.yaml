# The shared kube-linter checks of the templates of infra and of each repository that calls the
# reusable workflow .github/workflows/k8s-validate.yml with no kube-linter-config input. The
# workflow lints the rendered manifests of each Kustomize root and each Helm chart with this file.
# A finding fails the job. tests/test-kube-linter-config.sh tests the custom check.
#
# The checks are the default checks of kube-linter and the checks below, as in the
# .kube-linter.yaml of dan-petty/devops-cli. The default checks include run-as-non-root,
# no-read-only-root-fs, privilege-escalation-container, privileged-container,
# drop-net-raw-capability, latest-tag, unset-cpu-requirements, unset-memory-requirements, the
# PodDisruptionBudget checks and the probe port checks (`kube-linter checks list`).
#
# kube-linter takes no exception for one object in this file: `checks.exclude` turns a check off
# for all objects. An accepted exception is the annotation `ignore-check.kube-linter.io/<check>` on
# the object, with the reason as its value. Do not exclude a check here to pass a finding.
checks:
  include:
    # A pod with the default ServiceAccount sets automountServiceAccountToken: false.
    - default-service-account
    # Each container that serves traffic has a readiness probe and a liveness probe.
    - no-liveness-probe
    - no-readiness-probe
    # A Deployment, a StatefulSet and a DaemonSet roll, with an explicit strategy.
    - no-rolling-update-strategy
    # A NetworkPolicy selects each pod.
    - non-isolated-pod
customChecks:
  # Argo CD never prunes or deletes a PersistentVolumeClaim, and the data on its volume, when the
  # manifest leaves git or the Application is deleted.
  - name: pvc-prune-protection
    description: Indicates when Argo CD can prune or delete a PersistentVolumeClaim.
    remediation: >-
      Set the annotation argocd.argoproj.io/sync-options of the PersistentVolumeClaim to
      Prune=false,Delete=false.
    template: required-annotation
    scope:
      objectKinds: [PersistentVolumeClaim]
    params:
      key: ^argocd\.argoproj\.io/sync-options$
      value: ^(.*,)?(Prune=false,(.*,)?Delete=false|Delete=false,(.*,)?Prune=false)(,.*)?$
