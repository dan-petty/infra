# zizmor settings. The job YAML of ci.yml runs `zizmor --offline .github/workflows/`, which finds
# this file at the repository root (README.md, "Checks").
rules:
  # zizmor asks for the self-repository form `uses: $/...` of a call to a workflow of the same
  # repository. actionlint 1.7.12, the newest release, refuses that form (rhysd/actionlint#711), and
  # then does not check the inputs and secrets of the call. Thus these calls keep the form `./...`.
  # Remove the entries when a release of actionlint knows the form, and change the calls.
  self-repository:
    ignore:
      - ci.yml
      - pr-title-caller.yml
      - release-caller.yml
