name: Release

# The releases of infra (README.md, "Releases"). On each push to main, the job calls the reusable
# workflow release.yml of dan-petty/github-workflows at the commit of a release tag, as each other
# repository calls it, and Renovate moves the pin (README.md, "Pin a release"). The release pull
# request holds the next version in version.txt, .release-please-manifest.json and
# ansible/galaxy.yml, and the next tag in k8s/bases/service-repos/applicationsets.yaml
# (release-please-config.json).
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: Release
    uses: dan-petty/github-workflows/.github/workflows/release.yml@7b87b8c4e7a638fa1f3cd69903e720fdd487728a # v0.2.0
    permissions: {}
    # The job of release.yml runs in the environment release, so it gets the value of the secret of
    # that environment.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
