name: PR Title

# The pull request title check of a repository, as a reusable workflow. release-please reads the
# title of each commit on main as a Conventional Commit, and drops a title that it cannot parse with
# no warning (README.md, "Releases"). So this workflow checks the title of each pull request into
# main. The squash commit of a pull request with more than one commit gets the title of the pull
# request; that of a pull request with one commit gets the subject of the commit
# (squash_merge_commit_title COMMIT_OR_PR_TITLE). So validateSingleCommit also checks the subject of
# the commit of a pull request with one commit. The title is also the line of the changelog, so its
# summary has at most 60 characters. The action compares subjectPattern with the summary only.
#
# The scope is optional. A scope is the name after "scope/" of a scope/* label of the
# .github/labels.yml of the caller, or `main`, the scope of the release pull request of
# release-please. The job reads the labels file of the commit of the run, so a pull request that adds
# a scope label can use that scope in its title. Another repository calls the workflow at a release
# tag of infra, which Renovate updates (README.md, "Call the reusable workflows"):
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#       branches:
#         - main
#   permissions: {}
#   jobs:
#     pr-title:
#       name: PR title
#       uses: dan-petty/infra/.github/workflows/pr-title.yml@vX.Y.Z
#       permissions:
#         contents: read
#         pull-requests: read
#
# The job checks out the labels file of the caller, and the infra commit of this workflow
# (job.workflow_sha) into .infra-workflow. It installs the yq of the mise.toml and mise.lock of that
# commit, and scripts/pr-title-scopes.sh of that commit reads the scopes.
on:
  workflow_call:

permissions: {}

env:
  # No tool of the job reports usage.
  DO_NOT_TRACK: "1"
  MISE_USE_VERSIONS_HOST_TRACK: "false"

jobs:
