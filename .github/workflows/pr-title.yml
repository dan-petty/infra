>>>>>>> after updating
    permissions:
      contents: read # Check out the labels file of the repository.
      pull-requests: read # Read the title and the commits of the pull request.
    # A new edit or push cancels the check of the older title. The group has the prefix infra-, so it
    # is not the group of a caller (README.md, "Call the reusable workflows").
    concurrency:
      group: infra-pr-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out the labels file of the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/labels.yml

      - name: Check out the infra commit of this workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .infra-workflow
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mise.toml
            /mise.lock
            /scripts/pr-title-scopes.sh

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      # mise installs yq at the URL and checksum of mise.lock, and puts its folder first on PATH. A
      # mise.toml of the caller does not change it.
      - name: Install the yq of mise.lock
        timeout-minutes: 3
        working-directory: .infra-workflow
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          mise install --locked yq
          mise bin-paths yq >>"$GITHUB_PATH"

      # The labels file comes from the pull request, so the output gets a random delimiter: no line
      # of the file can end the value (GitHub docs, "Multiline strings").
      - name: Read the scopes of the labels file
        id: scopes
        timeout-minutes: 2
        run: |
          delimiter="scopes-$(openssl rand -hex 16)"
          {
            echo "list<<$delimiter"
            .infra-workflow/scripts/pr-title-scopes.sh .github/labels.yml
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"

      - name: Check that the title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          scopes: ${{ steps.scopes.outputs.list }}
          validateSingleCommit: true
          subjectPattern: ^.{1,60}$
          subjectPatternError: >-
            The summary after "<type>(<scope>): " has more than 60 characters. Shorten it to 60
            characters or fewer.
