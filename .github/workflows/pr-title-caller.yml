name: PR Title

# The title check of each pull request into main of infra (README.md, "Releases"). The job calls the
# reusable workflow pr-title.yml of the same commit, as each other repository calls it at a release
# tag. Thus each pull request of infra also tests the workflow. The scopes are those of every
# repository and those of the scope/* labels of .github/labels.yml.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions: {}

jobs:
  pr-title:
    name: PR title
    uses: ./.github/workflows/pr-title.yml
    permissions:
      contents: read
      pull-requests: read
