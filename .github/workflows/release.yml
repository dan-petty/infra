    permissions: {}
    # The runs of one branch do not overlap. The group has the prefix infra-, so it is not the group
    # of a caller (README.md, "Call the reusable workflows").
    concurrency:
      group: infra-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # Without the credentials, the next step stops with a message that does not name the
      # environment. This step names each missing credential and stops the job. When the caller does
      # not pass the secret, the run stops before the job starts (required: true).
      - name: Check the credentials of the release App
        env:
          HAS_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=""
          if [ "$HAS_CLIENT_ID" != true ]; then
            missing="no variable RELEASE_APP_CLIENT_ID"
          fi
          if [ "$HAS_PRIVATE_KEY" != true ]; then
            missing="${missing:+$missing and }no secret RELEASE_APP_PRIVATE_KEY"
          fi
          credentials="the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            message="The environment release of $GITHUB_REPOSITORY has $missing. A repository admin adds"
            message="$message $credentials of the release App to the environment release, and then"
            message="$message runs this job again."
            echo "::error title=Release credentials missing::$message"
            printf '> [!CAUTION]\n> %s\n' "$message" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "The environment release holds $credentials."

      - name: Mint the token of the release App
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The token gets only what release-please-action documents: the release pull request,
          # its labels, the CHANGELOG.md and version commits, the tag and the GitHub release.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # The action reads the release type of each package from the config file. Its input
      # release-type would make it ignore the config file and the manifest file, so the workflow does
      # not give it.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # Turn on auto-merge on each release pull request with the release App token.
      # GitHub merges it when its required checks pass. The App token merges so that the push event
      # of the merge commit starts the release workflow to create the tag and release.
      - name: Enable auto-merge on the release pull request
        if: >-
          steps.release.outputs.releases_created != 'true' &&
          (steps.release.outputs.pr != '' || steps.release.outputs.prs != '')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          numbers=$(echo "$RELEASE_PRS" | jq -r '.[].number // empty' 2>/dev/null || true)
          if [ -z "$numbers" ]; then
            numbers=$(echo "$RELEASE_PR" | jq -r '.number // empty' 2>/dev/null || true)
          fi
          for num in $numbers; do
            gh pr merge "$num" --repo "$REPOSITORY" --auto --squash
          done

      # Request review on each release pull request even on private Free repositories or repositories
      # without CODEOWNERS, skipping anyone already requested or matching the pull request author.
      - name: Request review on the release pull request
        if: >-
          steps.release.outputs.releases_created != 'true' &&
          (steps.release.outputs.pr != '' || steps.release.outputs.prs != '') &&
          inputs.reviewers != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
          REVIEWERS: ${{ inputs.reviewers }}
        run: |
          numbers=$(echo "$RELEASE_PRS" | jq -r '.[].number // empty' 2>/dev/null || true)
          if [ -z "$numbers" ]; then
            numbers=$(echo "$RELEASE_PR" | jq -r '.number // empty' 2>/dev/null || true)
          fi
          for num in $numbers; do
            pull_json=$(gh api "repos/$REPOSITORY/pulls/$num")
            IFS=',' read -ra wanted <<< "$REVIEWERS"
            for reviewer in "${wanted[@]}"; do
              reviewer="${reviewer//[[:space:]]/}"
              [ -z "$reviewer" ] && continue
              if jq -e --arg r "$reviewer" \
                '(.user.login != $r) and (([.requested_reviewers[]?.login] | index($r)) == null)' \
                <<<"$pull_json" >/dev/null; then
                gh api "repos/$REPOSITORY/pulls/$num/requested_reviewers" -f "reviewers[]=$reviewer" >/dev/null
              fi
            done
          done
