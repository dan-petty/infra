name: Release

# The release job of a repository, as a reusable workflow. release-please makes each release
# (README.md, "Releases"). On each push to main it opens or updates one release pull request, which
# holds the next version in the files of the release-please config of the caller, and the new entry
# of CHANGELOG.md. The workflow turns on auto-merge on the release pull request, and GitHub merges
# it when its required checks pass. The next run creates the tag vX.Y.Z and
# its GitHub release. Another repository calls the workflow at a release tag of infra, which
# Renovate updates (README.md, "Call the reusable workflows"):
#
#   on:
#     push:
#       branches:
#         - main
#   permissions: {}
#   jobs:
#     release:
#       name: Release
#       uses: dan-petty/infra/.github/workflows/release.yml@vX.Y.Z
#       permissions: {}
#       secrets:
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# The token of the release App opens the release pull request and creates the release tag, so the
# checks of the caller run on the pull request and the tag starts the workflows of the tag. A pull
# request or a tag that GITHUB_TOKEN creates starts no workflow. The job runs in the environment
# release of the caller, which holds the variable RELEASE_APP_CLIENT_ID and the secret
# RELEASE_APP_PRIVATE_KEY of the App, and only main deploys to it (devops-cli ADR 0032). The job
# that calls a reusable workflow cannot set environment, so this job sets it. The caller must still
# pass the secret by name, and the job gets the value of the environment secret (GitHub docs,
# "Reuse workflows", "Using inputs and secrets in a reusable workflow").
on:
  workflow_call:
    inputs:
      config-file:
        description: The release-please config file of the caller, relative to the repository root.
        type: string
        default: release-please-config.json
      manifest-file:
        description: The release-please manifest file of the caller, relative to the repository root.
        type: string
        default: .release-please-manifest.json
      reviewers:
        description: Comma-separated GitHub logins to request as reviewers on the release pull request.
        type: string
        default: dan-petty
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: >-
          The private key of the release App. Pass it by name; the job gets the value of the secret of
          the environment release of the caller.
        required: true
    outputs:
      release_created:
        description: true when the run created the release of the root package, else empty.
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The tag of the release that the run created, such as v1.2.3, else empty.
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions: {}

jobs:
